<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Robin's responsive portfolio website built with Flask, HTML and CSS.">
    <title>{% block title %}Robin's Portfolio{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <nav class="navbar container" aria-label="Main navigation">
            <a class="brand" href="{{ url_for('home') }}">Robin's <span>Portfolio</span></a>
            <button class="menu-toggle" type="button" aria-label="Toggle navigation"
                    aria-expanded="false" aria-controls="nav-links">☰</button>
            <div class="nav-links" id="nav-links">
                <a href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('about') }}">About</a>
                <a href="{{ url_for('home') }}#services">Services</a>
                <a href="{{ url_for('contact') }}">Contact</a>
            </div>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container footer-inner">
            <p>© 2026 Robin's Portfolio</p>
            <p>Built with HTML, CSS &amp; Flask</p>
        </div>
    </footer>
    <script>
        const toggle = document.querySelector(".menu-toggle");
        const links = document.querySelector(".nav-links");
        toggle.addEventListener("click", () => {
            const isOpen = links.classList.toggle("open");
            toggle.setAttribute("aria-expanded", String(isOpen));
        });
    </script>
</body>
</html>
